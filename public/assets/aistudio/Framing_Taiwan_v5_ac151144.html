 id:'bubble', icon:'🧋', name:['珍珠奶茶','Bubble tea'], micro:['一杯飲料，三個時代','A drink across three eras'],
 lead:['茶葉從田裡到杯裡，粉圓從甜點走進飲品；一杯珍奶又從臺灣走進世界。','Tea leaves, tapioca pearls, a new way of drinking—and then a cup travelling around the world.'],
 trace:[['1980年代的臺灣','1980s Taiwan'],['街頭手搖飲文化','Take-away tea culture'],['海外的 boba 店','Boba shops abroad']],
 clues:[
  {tag:['時間','TIME'],title:['不是一夜爆紅','It did not happen overnight'],zh:'臺灣珍珠奶茶在1980年代逐漸興起。臺中春水堂和臺南翰林茶館，都與其起源敘事相關。',en:'Bubble tea rose in Taiwan during the 1980s. Chun Shui Tang in Taichung and Hanlin Tea Room in Tainan both feature in accounts of its origins.',note:['沒有必要把有爭議的發明故事剪成單一版本。','A disputed origin need not become a single certainty on camera.']},
  {tag:['改造','CHANGE'],title:['茶也能「用咬的」','Tea you can chew'],zh:'傳統泡茶、冰茶與加入粉圓的喝法結合，改變飲料的口感，也改變了喝茶的日常。',en:'Traditional tea habits, iced tea, and tapioca pearls met in one cup, changing both texture and everyday tea culture.',note:['改變製作方式，也是在改變生活方式。','Changing a recipe can change a routine.']},
  {tag:['跨海','ABROAD'],title:['Boba 成了自己的語言','“Boba” becomes its own language'],zh:'珍奶從臺灣手搖飲文化走向海外市場。旅客、品牌與社群分享，使它不再只有一種喝法。',en:'Bubble tea moved from Taiwan’s take-away drink culture into overseas markets. Travellers, brands, and online sharing created new ways to drink it.',note:['全球化不是複製貼上，而是反覆調整。','Global circulation is repeated adaptation, not copy-and-paste.']}
 ],
 tension:['海外店家要推出「香草冰淇淋珍奶」，原店員擔心茶味被蓋住，留學生卻說那是朋友願意嘗試的第一步。','An overseas shop wants to sell vanilla-ice-cream boba. A barista fears the tea will disappear; a student says it may be the first version her friends will try.'],
 sample:['一杯珍奶可以有多少種故鄉？','How many hometowns can one cup hold?'],

},
{
 id:'stinky',icon:'🧊',name:['臭豆腐','Stinky tofu'], micro:['有些人聞到回憶，有些人只聞到臭味','Nostalgia to some; shock to others'],
 lead:['一種發酵食物，在臺灣夜市變成酥脆、泡菜、蒸煮和地方口味的集合。','A fermented food gains many lives at Taiwan’s night markets: crispy, steamed, pickled, local.'],
 trace:[['發酵豆腐傳統','Fermented tofu traditions'],['臺灣夜市的多種吃法','Taiwanese night-market variations'],['海外影片的味覺挑戰','Reaction videos overseas']],
 clues:[
  {tag:['傳說','LEGEND'],title:['王致和的傳說','The Wang Zhihe legend'],zh:'臭豆腐常見的起源說法涉及清代王致和的故事；這是流傳的故事，不能當成毫無疑義的確定史實。',en:'A popular origin tale names Wang Zhihe in the Qing era. It is a circulated story—not an unquestionable historical fact.',note:['連「起源」本身也可能是一種文化敘事。','An origin story can itself be a cultural narrative.']},
  {tag:['在地','LOCAL'],title:['一樣臭，不一樣吃','Same smell, many ways'],zh:'臺灣夜市常見油炸臭豆腐，不同地方也有蒸煮、醬汁與泡菜搭配等變化。',en:'Fried stinky tofu is familiar at Taiwanese night markets, but steaming, sauces, and pickles vary by locality.',note:['「臺灣人的吃法」其實有很多種。','There is no single Taiwanese way to eat it.']},
  {tag:['鏡頭','LENS'],title:['第一口的表情','The first-bite face'],zh:'從在地小吃變成海外影音常見的挑戰題材，食物有時只剩下「敢不敢吃」的敘事。',en:'As a food-challenge subject in overseas videos, the dish can be reduced to a single question: “Would you dare eat it?”',note:['影片放大了反應，也可能縮小了人。','A camera can magnify reaction while shrinking the people behind it.']}
 ],tension:['你想拍朋友第一次吃的驚恐表情。攤主說：「笑可以，但能不能也拍一下我每天凌晨備料的樣子？」','You want your friend’s shocked first bite. The vendor says, “Laugh if you like—but could you also film me preparing food before dawn?”'],
 sample:['觀眾看到的是食物，還是被鏡頭安排的驚嚇？','Do viewers see food—or a surprise arranged by the camera?'],exp:['臭豆腐攤主','a stinky tofu vendor'],overseas:['海外試吃影片','an overseas taste-test video'], source:'https://dict.th.gov.tw/Print.aspx?ID=2313'
},
{
 id:'noodle',icon:'🍜',name:['牛肉麵','Beef noodle soup'],micro:['異鄉的味道，如何成為臺灣味？','How an immigrant dish became Taiwanese'],
 lead:['一碗牛肉麵的湯裡，可能同時有移民記憶、地方變化與關於「正宗」的爭論。','One bowl can hold migration, local change, and competing ideas of what counts as authentic.'],
 trace:[['戰後移民與麵食傳統','Postwar migration and noodle traditions'],['臺灣南北不同口味','Regional Taiwanese styles'],['觀光與海外臺灣餐館','Tourism and overseas Taiwanese eateries']],
 clues:[
  {tag:['移動','MIGRATION'],title:['不是只有一條來路','More than one route'],zh:'戰後不同地區移民帶來麵食傳統，清燉與紅燒牛肉麵的歷史線索涉及不同社群與做法。',en:'Postwar migrants brought different noodle traditions; clear broth and red-braised styles have connections to different communities and techniques.',note:['一道國民美食，可能來自多個人的離鄉。','A national icon may contain several journeys from home.']},
  {tag:['爭議','DISPUTE'],title:['紅燒牛肉麵從哪裡開始？','Where did red-braised soup begin?'],zh:'牛肉麵起源有岡山和臺南等不同看法，不能硬把多條線索剪成唯一發明者。',en:'Accounts differ over whether Taiwanese red-braised beef noodles began in Gangshan or Tainan. Do not flatten contested histories into one inventor.',note:['史料留下空白時，懸念比武斷更有力量。','When records leave gaps, uncertainty can be stronger than false certainty.']},
  {tag:['認同','IDENTITY'],title:['過去的禁忌，今天的招牌','From taboo to signature'],zh:'臺灣早期農家依靠牛耕作，部分長者有不吃牛的習慣；今日牛肉麵又被視為代表料理。',en:'Oxen once powered agriculture, and some older Taiwanese avoided beef; today beef noodle soup is widely regarded as a signature dish.',note:['同一個社會對同一食材的意義也會改變。','A society can change what one ingredient means.']}
 ],tension:['一位老人說：「以前我們家不吃牛。」年輕老闆卻說：「我靠牛肉麵養大一家人。」你只剩一分鐘片長。','An elder says, “We never ate beef at home.” A young owner replies, “Beef noodles raised my family.” You have one minute left.'],
 sample:['一碗牛肉麵，要從誰的家鄉開始說？','Whose hometown begins this bowl?'],exp:['牛肉麵店老闆','a noodle shop owner'],overseas:['海外臺灣麵館','an overseas Taiwanese noodle shop'],source:'https://fae.moa.gov.tw/map/food_item.php?id=259&type=AS08'
},
{
 id:'xiaolong',icon:'🥟',name:['小籠包','Xiaolongbao'],micro:['手工與國際品牌之間','Between craftsmanship and global brand'],
 lead:['從中式點心傳統到臺灣餐飲品牌的國際展店，湯包走入了更多人的餐桌。','From Chinese dumpling traditions to a Taiwanese restaurant brand’s global reach, soup dumplings meet new audiences.'],
 trace:[['江南一帶的湯包傳統','Jiangnan soup-dumpling traditions'],['臺灣餐飲的精緻化','Refinement in Taiwan'],['國際品牌與海外餐桌','Global brands and overseas diners']],
 clues:[
  {tag:['轉折','TURN'],title:['油行轉成小籠包店','An oil shop becomes a dumpling shop'],zh:'鼎泰豐1958年在臺北從油行起家，1972年前後轉向小籠包餐飲；這是品牌歷史，不等於小籠包由該店發明。',en:'Din Tai Fung began as a Taipei oil shop in 1958 and moved toward xiaolongbao dining around 1972. That is a brand story—not the invention of soup dumplings.',note:['品牌故事和食物起源，是不同的兩件事。','A brand’s story is not the origin of the food.']},
  {tag:['手藝','CRAFT'],title:['十八摺與工序','Eighteen folds and process'],zh:'鼎泰豐以講究摺數與手工工序聞名，讓細節成為品牌可辨識的語言。',en:'Din Tai Fung has made careful folds and handwork a visible part of its global brand identity.',note:['一個工序，也能被拍成文化符號。','A production step can become a cultural symbol on camera.']},
  {tag:['海外','GLOBAL'],title:['同一道點心，不同店門','One dumpling, many doorways'],zh:'鼎泰豐從臺灣走向日本、美國、新加坡等市場；地方飲食因此進入國際服務與品牌體系。',en:'Din Tai Fung expanded from Taiwan into markets including Japan, the U.S., and Singapore, placing a local food experience into global service and branding systems.',note:['跨國傳播不只有味道，還有服務和形象。','Global circulation spreads service and imagery as well as taste.']}
 ],tension:['國外分店的主廚說「要每一顆都一模一樣」，外婆卻說「我家包的從來沒有兩顆一樣」。誰的「傳統」值得入鏡？','An overseas chef wants every dumpling identical. A grandmother says no two handmade dumplings in her home ever looked the same. Whose “tradition” goes on screen?'],
 sample:['當手藝成為品牌，什麼被留下？','When craft becomes a brand, what remains?'],exp:['點心師傅','a dumpling chef'],overseas:['國際連鎖餐廳','an international restaurant branch'],source:'https://www.dintaifung.com.tw/about.php'
},
{

 lead:['滷肉飯、肉燥飯與爌肉飯的稱呼和形態在臺灣各地有所不同。','Names and forms of braised pork rice, minced pork rice, and thick-cut pork rice vary around Taiwan.'],
 trace:[['臺灣各地家常飯食','Everyday rice dishes in Taiwan'],['南北名稱與肉型差異','Regional names and cuts'],['海外餐館與家庭食譜','Overseas restaurants and home recipes']],
 clues:[
  {tag:['語言','NAMES'],title:['一個名字，兩種點法','A name can order two dishes'],zh:'在臺灣不同地方，滷肉飯、肉燥飯等名稱與肉的形態不一定完全對應。',en:'Across Taiwan, labels such as lu rou fan and rou zao fan do not always map onto the same meat preparation.',note:['名稱不只是菜單，也可以是地方認同。','A menu word can carry regional identity.']},

 tasks:[{label:['決定要拍哪一種臭豆腐','Choose the tofu preparation'],question:['攝影師想要最誇張的味道，攤販拿出炸、蒸、麻辣三種。你要先讓觀眾看到什麼？','Your camera friend wants maximum shock. The vendor offers fried, steamed and spicy versions. What comes first?'],choices:[[['炸臭豆腐與臺式泡菜','Fried tofu with Taiwanese pickles'],'translator',['外國朋友說香脆很好入口，開始理解和氣味的反差。','A newcomer enjoys the crunchy contrast with the smell.']],[['蒸臭豆腐的湯汁與調味','Steamed tofu, broth and seasoning'],'archivist',['一名熟客說：這才是他家餐桌上的味道。','A regular says it reminds them of home.']],[['只拍捏鼻子的誇張特寫','Only close-ups of shocked faces'],'spotlight',['影片很有笑點，但攤販悄悄收回準備介紹的菜單。','A funny cut; the vendor quietly puts away the menu she hoped to explain.']]]},
 {label:['國外觀眾的疑問','An overseas viewer asks'],question:['留言：「你們是不是每個人都愛吃這個？」你如何安排下一個畫面？','Comment: “Do ALL Taiwanese people love this?” What is your next shot?'],choices:[[['找三位喜好不同的在地人','Ask three locals with different tastes'],'editor',['不同意見在同一片段裡出現。','Contrasting local opinions coexist on screen.']],[['介紹發酵與地方口味差異','Explain fermentation and regional styles'],'translator',['觀眾聽見了一段不只是獵奇的故事。','Viewers get a story beyond shock.']],[['乾脆再拍一個更刺激的挑戰','Film an even bolder challenge'],'spotlight',['觀眾更多了，但刻板印象也被重複。','The views rise; so does the repetition of a stereotype.']]]}],overseas:['香港的臭豆腐和臺灣夜市做法並不完全相同。影片裡的一次驚訝，不能代表整個文化群體的口味。','Hong Kong and Taiwan do not prepare stinky tofu in identical ways. One shocked reaction cannot represent the tastes of a whole society.'],source:'https://eng.taiwan.net.tw/m1.aspx?sno=0024013'},
 noodle:{place:['四川與戰後移民記憶 → 臺灣 → 洛杉磯','Sichuan / postwar migration → Taiwan → Los Angeles'],history:['戰後移居臺灣者帶來多地麵食技法，紅燒、清燉與地方食材在臺灣交會；海外臺灣餐館又讓它變成移民的家常味。','Postwar migrants brought multiple noodle traditions. Braised and clear-broth styles met local ingredients in Taiwan; overseas restaurants made the dish a taste of migrant home.'],tasks:[{label:['拼出一碗跨世代的牛肉麵','Build a multigenerational bowl'],question:['你只有三張素材卡：外省老兵回憶、在地牛肉湯、年輕店家的新做法。怎麼拼？','You have three footage cards: a veteran’s memory, local beef soup, and a young chef’s changes. What leads?'],choices:[[['先拍老兵當年的離鄉','Begin with a migrant’s journey'],'archivist',['一碗湯變得有了時間深度。','The broth acquires a longer memory.']],[['三張素材分屏，讓歷史相遇','Split-screen three histories'],'editor',['觀眾開始明白「起源」不是單數。','Viewers see that origin need not be singular.']],[['直接拍最濃郁的紅燒湯頭','Start with the richest red broth'],'spotlight',['食慾大開；仍有人問清燉為何消失了。','It looks delicious; viewers still ask where clear broth went.']]]},{label:['替海外客人說明何謂臺灣牛肉麵','Describe Taiwanese beef noodles abroad'],question:['洛杉磯店家想寫「正宗臺灣牛肉麵」。你要補上什麼？','An LA menu says “authentic Taiwanese beef noodle soup.” What would you add?'],choices:[[['只保留正宗二字','Keep “authentic” alone'],'spotlight',['簡單有力，但故事變短了。','Punchy—but a shorter story.']],[['介紹移民與地方融合','Mention migration and local adaptation'],'translator',['客人知道它如何變成臺灣味。','Customers discover how it became Taiwanese.']],[['讓不同世代的家庭說自己的版本','Let families tell different versions'],'editor',['菜單背後不再只有一位作者。','There is more than one author behind the menu.']]]}],overseas:['海外移民店家把「臺灣味」寫在招牌上；老客人記得家鄉的湯，下一代則在新城市建立自己的口味。','An immigrant shop calls itself “Taiwanese”; older customers remember home broth, while younger diners build new taste memories in another city.'],source:'https://taiwanreview.nat.gov.tw/AMP/Culture/Top-News/24443/Taiwanese-cuisine-reflects-nation%27s-historical-odyssey'},
 xiaolong:{place:['江南點心傳統 → 臺灣餐飲 → 日本與美國','Jiangnan dumpling traditions → Taiwan → Japan & the U.S.'],history:['小籠包與江南點心有關，臺灣餐飲品牌將精密工序與服務體驗帶向國際；不要把品牌成功誤認成食物的起源。','Xiaolongbao has roots in Jiangnan food traditions; Taiwanese restaurants globalized a meticulous production and service experience. Brand success is not the dish’s invention.'],tasks:[{label:['包一顆給海外分店的湯包','Fold a dumpling for an overseas branch'],question:['分店要把手工技法標準化，老廚師卻怕失去手感。你如何呈現？','An overseas branch wants consistent techniques; the chef worries that a craft cannot be fully standardized. How will you show both?'],choices:[[['放大鏡頭拍師傅的手','Close-ups of the chef’s hands'],'archivist',['人們看到技術也是記憶。','Craft becomes visible as memory.']],[['把工序與服務並排呈現','Show craft and service side by side'],'translator',['一顆湯包不只是摺數，也是世界餐飲經驗。','Dumplings become more than pleats: a global dining experience.']],[['只展示整齊排隊與名店光環','Focus on the famous brand and queue'],'spotlight',['人氣很明顯，江南與臺灣的歷史連結卻不見了。','Brand visibility rises; historical connections disappear.']]]},{label:['向海外觀眾解釋起源','Explain origins to overseas viewers'],question:['觀眾說：「臺灣發明了小籠包！」你要如何處理這句話？','A viewer says: “Taiwan invented soup dumplings!” What now?'],choices:[[['保留，這樣比較好懂','Leave it: a clean headline'],'spotlight',['句子很短，但會誤導觀眾。','A short line, but a misleading one.']],[['補上江南源流與臺灣品牌推廣','Add Jiangnan roots and Taiwanese branding'],'translator',['觀眾知道傳播不等於發明。','The audience sees that circulation is not invention.']],[['讓兩地廚師各自描述','Let cooks from both places speak'],'editor',['觀眾聽見多個歷史位置。','Multiple historical positions become audible.']]]}],overseas:['日本與美國的分店讓不少人第一次認識小籠包，卻也可能把某家臺灣品牌誤認成這種食物的唯一來源。','Branches in Japan and the U.S. introduced many diners to soup dumplings, while also risking confusion between a Taiwanese brand and the dish’s origin.'],source:'https://www.scmp.com/lifestyle/food-drink/article/3097791/history-xiaolongbao-or-soup-dumplings-outskirts-shanghai'},
 porkrice:{place:['臺灣家常飯食 → 紐約／洛杉磯的臺式餐館','Taiwanese home rice dishes → New York / Los Angeles eateries'],history:['滷肉飯從惜食與家常料理走到臺灣小吃招牌；名稱、肉型與甜鹹在島內就有地方差異，海外又會因食材供應調整。','Born of everyday frugality, braised pork rice has multiple Taiwanese names, cuts and sweetness levels. Overseas suppliers invite further adaptations.'],tasks:[{label:['替海外菜單選一個名字','Name a dish on an overseas menu'],question:['客人看不懂「滷肉飯」，另一位臺灣顧客又說北中南叫法不同。你會怎麼寫？','A guest cannot read “lu rou fan”; a Taiwanese diner says names vary by region. What goes on the menu?'],choices:[[['Taiwanese Pork Rice，簡單好懂','“Taiwanese Pork Rice,” clear and simple'],'spotlight',['好點餐，地方差異卻被簡化。','Easy to order; regional variation gets flattened.']],[['滷肉飯 Lu Rou Fan＋食材註解','“Lu Rou Fan” plus a brief ingredient note'],'translator',['名稱保留，也有理解的橋。','The name remains, with a bridge for newcomers.']],[['加入「店家版本」與南北說法','Explain the shop’s regional version'],'archivist',['這不是唯一版本，而是某個人的家常味。','It is one household’s version, not the only version.']]]},{label:['改變肉的切法算失去傳統嗎？','Does a new cut erase tradition?'],question:['海外廚房只能取得不同部位的豬肉。店家準備調整比例。你會怎麼拍？','An overseas kitchen can source a different cut of pork, so the chef plans to adjust the recipe. How would you film it?'],choices:[[['對照臺灣與海外兩種實作','Compare both kitchens'],'translator',['你拍到變形的原因而非只看差異。','You show why it changed, not merely how.']],[['記錄廚師的家族食譜','Record the family recipe'],'archivist',['一道飯保存了代際記憶。','A bowl carries generational memory.']],[['只用「不正宗」做標題','Headline: “Not authentic!”'],'spotlight',['爭論拉高熱度，也遮住了採買的現實。','The argument goes viral; sourcing constraints vanish.']]]}],overseas:['美國大城市的臺式餐館既是新鮮體驗，也是部分海外臺裔尋找家鄉味的空間；同一道飯可能同時服務兩種期待。','Taiwanese eateries in large U.S. cities can be new discoveries for some and comforting spaces for diasporic Taiwanese; one bowl can serve different needs.'],source:'https://guide.michelin.com/tw/en/article/travel/taiwanese-cuisine-michein-restaurants-across-the-world'},
 chicken:{place:['臺灣夜市 → 海外臺式炸雞品牌','Taiwanese night markets → overseas Taiwanese fried-chicken shops'],history:['鹽酥雞常見甜薯粉外皮、九層塔和胡椒鹽；國際市場可能改成套餐、三明治或配飲料。起源年份與發明者常有爭議。','Taiwanese popcorn chicken often uses sweet-potato starch, basil and pepper salt; abroad it may become a combo meal or branded fast food. Single-inventor stories remain uncertain.'],tasks:[{label:['組一份不同城市的鹽酥雞','Assemble popcorn chicken for two cities'],question:['國外快餐店想把九層塔換成乾燥香草，也想改成無骨大份量。你怎麼介紹？','An overseas shop considers dried herbs instead of fresh basil and larger boneless portions. How do you explain the change?'],choices:[[['介紹配料取得與成本','Explain ingredient availability and cost'],'translator',['你拍到料理變形是有脈絡的。','Adaptation now has context.']],[['拍原攤主如何炸九層塔','Film the original vendor frying basil'],'archivist',['製作技巧在鏡頭裡變得珍貴。','The technique becomes visible.']],[['只下標「外國把鹽酥雞毀了」','Headline: “They ruined it!”'],'spotlight',['吸睛，卻把不同做法變成對立。','A hook that turns variations into enemies.']]]},{label:['起源有兩個不同說法','Two origin stories conflict'],question:['兩家店都說自己是最早的，你會怎麼剪？','Two shops each claim to be first. How do you edit them?'],choices:[[['兩個人都入鏡並標示「說法」','Keep both as competing accounts'],'editor',['沒有強行替歷史下定論。','You avoid forcing certainty onto the record.']],[['找到市場變遷與夜食文化的脈絡','Place the claims in changing night-life context'],'archivist',['故事不再只剩名號。','The history becomes bigger than credit.']],[['宣布人氣更高者才是真祖先','Declare the more popular one the inventor'],'spotlight',['你得到一個主角，也省略了反證。','You get a hero while excluding contradiction.']]]}],overseas:['海外「臺式炸雞」的菜單和套餐形式可能借用當地速食文化；不是每一種變形都意味著失去原本的文化身分。','Overseas “Taiwanese fried chicken” can adopt local fast-food meal formats; variation does not automatically erase cultural identity.'],source:'https://guide.michelin.com/tw/en/article/travel/must-try-street-food-taiwan'},
 danbing:{place:['戰後臺灣麵食轉變 → 海外臺灣早餐店（情境）','Postwar Taiwanese wheat culture → overseas Taiwanese breakfast shop (fictional)'],history:['戰後移民與美援麵粉促成臺灣早餐麵食發展。蛋餅逐漸形成粉漿、現成餅皮與加料等做法；海外早餐店情節為虛構模擬。','Postwar migration and U.S. flour aid reshaped Taiwanese breakfasts. Batter-based and wrapper-based egg pancakes developed; the overseas shop in this scene is fictional.'],tasks:[{label:['經營一個清晨時段','Run a breakfast rush'],question:['7:40 排隊十個人。粉漿版較費時，現成餅皮較快。你要選哪種流程？','Ten customers queue at 7:40. Batter takes longer; prepared wrappers move faster. Which workflow?'],choices:[[['做粉漿版並告知需要等','Make batter pancakes and explain the wait'],'archivist',['客人看見了手藝與時間。','Customers notice craft and time.']],[['兩種做法各留一個窗口','Offer two queues and explain the styles'],'editor',['不同時間需求都被看見。','Different time needs are recognized.']],[['只求出餐速度，當它就是唯一標準','Make speed the only rule'],'spotlight',['出餐很快，老闆想講的歷史被擱下。','Orders fly out; the history stays untold.']]]},{label:['海外菜單怎麼介紹蛋餅？','Explain dan bing abroad'],question:['店家打算寫「Taiwanese breakfast burrito」。你會怎麼補一句？','A shop plans to call it a “Taiwanese breakfast burrito.” What would you add?'],choices:[[['保留蛋餅名並說明粉漿或餅皮','Keep “dan bing” and explain batter/wrapper'],'translator',['既好懂又不完全失去原名。','Accessible while retaining its name.']],[['把老闆的移民與家庭記憶寫進卡片','Include the owner’s family story'],'archivist',['客人得到一段比翻譯更長的故事。','Customers get a story beyond translation.']],[['只寫 burrito，不提臺灣','Just call it a burrito'],'spotlight',['客人比較熟悉，來源卻消失了。','Familiarity rises; origins vanish.']]]}],overseas:['這是一個虛構的海外早餐店情境，用來想像早餐節奏與臺灣食物在新城市的翻譯問題，不是有考據的單一店家史實。','This fictional overseas breakfast-shop scene explores daily rhythms and translation, not the documented history of a specific shop.'],source:'https://collections.nmth.gov.tw/article.aspx?a=244'},
 pineapple:{place:['臺灣糕餅 → 日本伴手禮市場／國際旅客','Taiwanese pastry → Japanese souvenir market / international visitors'],history:['鳳梨酥由糕餅與鳳梨、冬瓜餡逐步演化，2000年代後土鳳梨餡風潮擴大。送禮與「旺來」的諧音是文化意義的一部分。','Pineapple cakes evolved through local pastry and mixed pineapple/winter-melon fillings; pineapple-rich variants rose later. Gifting and the “prosperity comes” pun are part of their meaning.'],tasks:[{label:['替一盒鳳梨酥選內餡','Choose a filling for a gift box'],question:['海外旅客只想要「100% 鳳梨」，阿嬤卻愛冬瓜混合餡。你選哪一盒放主視覺？','Tourists want “100% pineapple”; grandmother loves the winter-melon blend. Which goes on the front label?'],choices:[[['純鳳梨餡，標清楚酸香與纖維','Pineapple-rich, labeled tart and fibrous'],'translator',['新選擇有特色，但不是唯一的傳統。','A distinctive choice, not the only tradition.']],[['冬瓜混合餡與老店記憶','Classic mixed filling and older memories'],'archivist',['旅客第一次聽見冬瓜的理由。','Visitors learn why winter melon was used.']],[['兩盒並列，標示年代與風味','Offer both with histories and flavours'],'editor',['差異變成文化線索，而不是對錯題。','Variation becomes a clue, not a right/wrong test.']]]},{label:['把「旺來」翻到海外','Translate “prosperity comes”'],question:['日本客人想知道為何新年送鳳梨酥。你會怎麼說？','A Japanese visitor asks why people gift pineapple cakes for New Year. How will you explain it?'],choices:[[['用臺語諧音與祝福卡介紹','Include the Hokkien pun and a blessing card'],'translator',['一個聲音連起了一種送禮關係。','A word sound connects to a social relationship.']],[['訪問收到禮物的不同家人','Ask relatives what receiving it means'],'editor',['祝福不只是一句口號。','A blessing means different things to different people.']],[['只寫「臺灣必買」','Label simply “Taiwan must-buy”'],'spotlight',['賣點清楚，語言文化卻沒有出場。','A clear sales pitch; the linguistic story disappears.']]]}],overseas:['旅客將鳳梨酥帶出臺灣時，也帶著對「臺灣味」的想像；不同內餡與送禮理由會讓故事改寫。','When visitors carry pineapple cakes abroad, they also carry an imagined “taste of Taiwan”; fillings and gifting contexts reshape the story.'],source:'https://www.taiwanngo.tw/Post/84265'},
 guabao:{place:['閩南與臺灣尾牙 → 紐約 Baohaus → 倫敦 BAO','Fujian and Taiwanese year-end rituals → New York Baohaus → London BAO'],history:['刈包與閩南飲食及臺灣尾牙等習俗有連結；2009年 Baohaus 及倫敦 BAO 等案例讓蒸包進入國際時尚餐飲。海外配料與命名會變。','Gua bao connects Fujian foodways and Taiwanese year-end customs. Baohaus in New York and BAO in London popularized new forms and names abroad.'],tasks:[{label:['幫倫敦餐車設計菜單','Design a London bao menu'],question:['店家想把刈包叫做「Asian taco」。你有五秒讓客人理解。','The owner calls gua bao an “Asian taco.” You have five seconds to explain it.'],choices:[[['直接用 Asian taco 就好','Only use “Asian taco”'],'spotlight',['好賣，但來源更模糊。','It sells; the origin grows fuzzier.']],[['寫 Gua Bao，附蒸包與食材說明','Keep “Gua Bao” with a description'],'translator',['新客人能點餐，也看得見名字。','Newcomers can order without losing the name.']],[['留下店主的移民家族故事','Add the owner’s family migration story'],'archivist',['菜單變成跨代的敘事。','The menu carries generations.']]]},{label:['跨國配料實驗','An international filling experiment'],question:['國外顧客想要豆腐與蘑菇版本，老客人偏愛滷五花肉。你會怎麼拍？','A diner asks for tofu and mushroom; another wants braised pork belly. How do you frame the two?'],choices:[[['新舊都拍，讓兩種需求互相回答','Film both and let them answer each other'],'editor',['文化不是只有複製，也包含接納。','Culture can include both continuity and inclusion.']],[['研究兩種做法各自的使用情境','Explore where each version belongs'],'translator',['變形有了社會脈絡。','Adaptation gains context.']],[['只拍最誇張的創新餡料','Show only the wildest filling'],'spotlight',['吸睛，卻忘了尾牙與「虎咬豬」。','It grabs attention but forgets year-end rituals.']]]}],overseas:['在紐約和倫敦，「bao」變得很熟悉，卻有時讓人忘記它的閩南及臺灣飲食脈絡；翻譯與品牌化既能打開入口，也會改變來源印象。','In New York and London, “bao” became familiar, sometimes at the cost of obscuring Fujianese and Taiwanese context; translation and branding both open doors and reshape origin stories.'],source:'https://nspp.mofa.gov.tw/nsppe/print.php?post=222004&unit=410'},
 scallion:{place:['山東與戰後麵食傳統 → 臺灣夜市 → 海外冷凍市場（情境）','Northern wheat traditions → Taiwanese night markets → overseas frozen-food market (fictional)'],history:['臺灣蔥抓餅重視抓鬆麵皮的口感；麵食習慣與戰後臺灣的移民、麵粉取得和街頭生活變化有關。海外冷凍販售場景為設計情境。','Taiwanese scallion pancakes highlight pull-apart layers; wheat culture intersects with postwar migration, flour access, and street life. The frozen-food export scene is fictional.'],tasks:[{label:['抓鬆麵皮還是機械量產？','Hand-pulled texture or factory production?'],question:['海外訂單太多，工廠想把手抓工序改成機械製作。你怎麼展示？','Demand is high abroad, and a factory proposes mechanizing the pull-apart step. How will you show it?'],choices:[[['慢鏡拍師傅手上的抓鬆動作','Slow-motion the vendor’s hand technique'],'archivist',['技術變成有溫度的文化記憶。','The technique becomes tactile memory.']],[['並列手工與冷凍產品的口感','Compare handmade and frozen versions'],'translator',['觀眾理解成本與手藝的取捨。','Viewers see craft and access costs.']],[['只講「工廠毀掉傳統」','Headline: “Factories kill tradition”'],'spotlight',['流量高，但外國消費者的需求被忽略。','Engagement rises; overseas needs disappear.']]]},{label:['國外搭配新配料','New toppings abroad'],question:['起司、雞蛋與香料醬成為熱門加料。老師傅問：「這還算蔥抓餅嗎？」','Cheese, egg and new sauces become popular. The elder asks: “Is it still scallion pancake?”'],choices:[[['訪問不同年齡的顧客','Interview customers of different ages'],'editor',['傳統的邊界由不同人一起討論。','The boundary of tradition becomes a conversation.']],[['介紹原本技法，再展示新配料','Show the original method then adaptations'],'translator',['手藝與新口味可以同框。','Craft and novelty share the frame.']],[['宣布只有原味才有資格','Declare only the original legitimate'],'spotlight',['說法很響亮，但關閉了文化變動的空間。','A strong verdict, but little room for change.']]]}],overseas:['海外冷凍蔥抓餅是本遊戲的虛構小任務，用來思考手工技術如何在跨國供應鏈下變形，而非指涉單一真實公司的歷史。','The overseas frozen-pancake segment is a fictional task to explore how manual technique adapts to supply chains, not the history of a specific real company.'],source:'https://collections.nmth.gov.tw/article.aspx?a=244'}
};

 archivist:{name:['街角的紀錄者','The Street-Corner Archivist'],subtitle:['你收藏的是城市沒說完的話','You collect the sentences a city never finished'],paragraph:['你留意細小的日常、被忽略的聲音與相互矛盾的記憶。你的影像像一份仍可補寫的地方誌。','You notice quiet routines, overlooked voices, and contradictory memories. Your films become an unfinished local archive.'],question:['誰會在十年後，重新解讀你留下的鏡頭？','Who might reinterpret your footage ten years from now?'],portrait:'lin',color:'#ffca90',glyph:'◈'},
 translator:{name:['跨海的文化翻譯者','The Cross-Sea Translator'],subtitle:['你知道改變不必等於失去','You know change is not always loss'],paragraph:['你總想追問：一道食物出了海，為什麼換了名字與做法？你善於讓兩種文化碰面，但也開始警覺翻譯可能省略的細節。','You ask why a food changes its name and method after crossing the sea. You connect cultures—and notice what translation may leave behind.'],question:['讓兩邊都聽得懂時，你願意保留哪些不容易翻譯的部分？','When both sides can understand, what will you refuse to simplify?'],portrait:'maya',color:'#bde5ef',glyph:'⌁'},
 spotlight:{name:['聚光燈下的說故事者','The Spotlight Storyteller'],subtitle:['你讓陌生人願意停下來看','You know how to make a stranger look'],paragraph:['你善於捕捉第一眼的驚喜，懂得節奏、標題與反應的力量。更多人因此看見臺灣，但你也開始發現，點開影片不等於看見全部。','You capture moments of wonder, and understand hooks, titles and reactions. More people look toward Taiwan through your films—but a click is not the full picture.'],question:['當觀眾停下來後，你要把鏡頭轉向誰？','Once you have their attention, whom will you turn the camera toward?'],portrait:'alex',color:'#f7b497',glyph:'✷'},
 editor:{name:['多聲音的編輯者','The Many-Voiced Editor'],subtitle:['你願意把畫面留給別人','You leave space in the frame for others'],paragraph:['你不急著替每個人說出答案，反而更願意讓不同立場的人彼此回應。你的作品可能不夠整齊，但那些不一致，正是它的生命力。','You resist speaking for everyone, preferring to let people answer each other. Your work may be untidy—but disagreement gives it life.'],question:['下一位還沒有機會開口的人，是誰？','Who still has not been invited to speak?'],portrait:'xiao',color:'#bdeac8',glyph:'✺'},

const T=(v)=>Array.isArray(v)?v[state.lang==='en'?1:0]:(v??'');
const G=()=>ui[state.lang];
const startState=()=>({lang:null,phase:'home',food:null,clues:[],viewClue:null,choices:[],points:{archivist:0,translator:0,spotlight:0,editor:0,between:0,questioner:0},rating:0,notes:'',taskStep:0,miniSelections:[],passportChoice:null,mirrorFocus:'',mirrorText:'',createdAt:new Date().toISOString()});
let state=startState();let sourceOpen=false;
try{const saved=JSON.parse(localStorage.getItem(K)||'null');if(saved && saved.phase&&saved.points&&saved.clues)state=saved;}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}}
function reset(){const lang=state.lang;state=startState();state.lang=lang;state.phase='food';sourceOpen=false;save();render()}
function run(choice,tag){state.choices.push({phase:state.phase,choice,tag});state.points[tag]=(state.points[tag]||0)+2;save();}
function next(phase){state.phase=phase;state.viewClue=null;save();render();window.scrollTo(0,0)}
function ff(){return foods.find(f=>f.id===state.food)||foods[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function escapeMult(s){return esc(s).replace(/\n/g,'<br>')}
function btn(text,onclick,cl='primary'){return `<button class="btn ${cl}" ${onclick}>${text}</button>`}
function stamp(){return `<div class="stamp"><span class="dot"></span>${esc(state.lang==='en'?'CULTURE · CAMERA · CHOICE':'文化 · 鏡頭 · 選擇')}</div>`}
function foodIntro(f){return `<div class="food-story-header"><div class="hugefood" aria-hidden="true">${f.icon}</div><div><div class="eyebrow">${esc(T(f.micro))}</div><h1>${esc(T(f.name))}</h1><p>${esc(T(f.lead))}</p></div></div>`}

function neighborhoodScreen(){return `<section class="frame">${breadcrumb(2)}<div class="eyebrow">THE CITY SEES YOU BACK</div><div class="story-side"><div class="people-graphic"><div class="halo"></div><div class="actor actor-one">安</div><div class="actor actor-two">M</div><div class="caption-float">BELONGING<br>WHO DECIDES?</div></div><div class="story-content"><h1>${state.lang==='en'?'“You speak Chinese so well!”':'「哇！你中文<br>講得很好耶！」'}</h1>${dialogue(['小安 · 臺灣朋友','Xiao-An · Taiwanese friend'],['我只是想表示友善。可是你說每次在超商都被稱讚中文，反而提醒你自己永遠像客人……我之前沒想過這個角度。','I meant it as a compliment. But you said hearing it every day makes you feel like a perpetual visitor. I had never thought of that.'])}
 ${dialogue(['Maya · 長住者','Maya · long-term resident'],['我喜歡臺灣，也確實遇過不熟悉的規則。某些人對我非常友善，但我不能把自己的經驗說成所有移居者的經驗。','I love living here, and I have struggled with unfamiliar rules. Many people have been kind, but my experience cannot speak for every migrant.'])}</div></div>

 {tag:'between',title:['坦白說自己同時感到被接納與被區分','Say you feel both welcomed and singled out'],detail:['讓矛盾成為可說的事。','Let contradictory feelings coexist.']}])}</section>`}
function mirrorScreen(){const en=state.lang==='en',choices=[{tag:'archivist',title:['一種陪我長大的味道，讓我想起家人','A food from childhood makes me think of family'],detail:['文化在日常細節與家庭記憶裡延續。','Culture persists through mundane family memories.']},

 <h2 class="question-title">${en?'Which image would you leave on screen?':'如果只能留下最後一個畫面，你會選？'}</h2>${options(choices)}</section>`}

{tag:'spotlight',title:['繼續追逐令人驚奇的臺灣','Keep finding surprising Taiwan'],detail:['觀看數成長，但大家期待你一直是「驚訝的外國人」。','More views, but an endless expectation of the “shocked foreigner.”']},

function modal(){const f=ff();return `<div class="modal-back" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="Sources"><button class="modal-x" data-act="close">✕</button><div class="section-tag">${esc(G().notes)}</div><h2>${state.lang==='en'?'Facts behind the fiction':'故事背後的考據'}</h2><p>${esc(G().sourceDesc)}</p><div class="source-links">${foods.map(x=>`<a href="${esc(missions[x.id]?.source||x.source)}" target="_blank" rel="noopener noreferrer">${x.icon} ${esc(T(x.name))}<span>↗</span></a>`).join('')}</div><div class="additional-refs"><a href="https://www.tandfonline.com/doi/full/10.1080/14708477.2018.1450878" target="_blank" rel="noopener">↗ ${state.lang==='en'?'Foreign YouTubers and negotiated identity (peer-reviewed study)':'在臺外籍 YouTuber 的跨文化身份協商（學術研究）'}</a><a href="https://jossh.ussh.edu.vn/index.php/JOSSH-VN/article/view/588" target="_blank" rel="noopener">↗ ${state.lang==='en'?'International student adaptation and language barriers':'在臺外籍學生的文化適應與語言困難（研究）'}</a></div><p class="mini muted">${state.lang==='en'?'Not every overseas scene is a documented historical event; hypothetical scenes are signposted in the content.':'並非所有海外情節都是已發生的歷史事件；部分海外人物衝突是為了體驗文化取捨而設計的虛構情境。'}</p></div></div>`}
function langGate(){return `<div class="language-back"><div class="language-card">${stamp()}<div class="lg-camera">◎</div><h1>臺灣印象製作所<br><em>Framing Taiwan</em></h1><p>Choose your language / 請選擇遊戲語言</p><div class="langs"><button data-lang="zh">繁體中文 <span>→</span></button><button data-lang="en">English <span>→</span></button></div><small>An interactive cultural story / 華人文化社會互動敘事</small></div></div>`}
function render(){document.documentElement.lang=state.lang==='en'?'en':'zh-Hant';const root=document.getElementById('app');if(!state.lang){root.innerHTML=langGate();return}root.innerHTML=`${nav()}<main class="app">${({home:cover,food:foodSelect,trace:clueScreen,workshop:workshopScreen,passport:passportScreen,market,cut:editScreen,transition,arrival:arrivalScreen,language:languageScreen,neighborhood:neighborhoodScreen,table:tableScreen,creator:creatorScreen,subtitle:subtitleScreen,comments:commentsScreen,identity:identityScreen,mirror:mirrorScreen,finalcut:finalcutScreen,end:endScreen})[state.phase]?.()||cover()}</main><footer class="footer"><span>© 2026 FRAMING TAIWAN · STORY EDITION</span><span>${esc(G().storyScope)}</span></footer>${sourceOpen?modal():''}`}
function pickOption(index){
 const to={
 market:{next:'cut',choices:dilemmas},cut:{next:'transition',choices:edits},
 arrival:{next:'language',choices:[{tag:'between'},{tag:'editor'},{tag:'spotlight'}]},
 language:{next:'neighborhood',choices:[{tag:'translator'},{tag:'between'},{tag:'questioner'}]},
 neighborhood:{next:'table',choices:[{tag:'editor'},{tag:'archivist'},{tag:'between'}]},
 table:{next:'creator',choices:[{tag:'editor'},{tag:'between'},{tag:'archivist'}]},
 creator:{next:'subtitle',choices:[{tag:'spotlight'},{tag:'archivist'},{tag:'between'}]},
 subtitle:{next:'comments',choices:[{tag:'translator'},{tag:'spotlight'},{tag:'editor'}]},
 comments:{next:'identity',choices:[{tag:'editor'},{tag:'spotlight'},{tag:'questioner'}]},
 identity:{next:'mirror',choices:[{tag:'between'},{tag:'editor'},{tag:'questioner'}]},
 mirror:{next:'finalcut',choices:[{tag:'archivist'},{tag:'translator'},{tag:'editor'}]},
 finalcut:{next:'end',choices:[{tag:'editor'},{tag:'archivist'},{tag:'translator'}]}
 };
 const x=to[state.phase]; if(!x||!x.choices[index])return;
 run(index,x.choices[index].tag);
 if(state.phase==='cut')state.editedTitle=edits[index].title;
 next(x.next);
}
document.addEventListener('click',(e)=>{const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;save();render();return}const food=e.target.closest('[data-food]');if(food){state.food=food.dataset.food;state.clues=[];state.choices=[];state.points={archivist:0,translator:0,spotlight:0,editor:0,between:0,questioner:0};state.taskStep=0;state.miniSelections=[];state.passportChoice=null;state.mirrorFocus='';state.mirrorText='';next('trace');return}const clue=e.target.closest('[data-clue]');if(clue){const i=Number(clue.dataset.clue);state.viewClue=i;if(!state.clues.includes(i)){state.clues.push(i);state.points[i===0?'archivist':i===1?'translator':'questioner']++;}save();render();return}const mini=e.target.closest('[data-mini]');if(mini){miniPick(Number(mini.dataset.mini));return}const pass=e.target.closest('[data-passport]');if(pass){passPick(Number(pass.dataset.passport));return}const opt=e.target.closest('[data-option]');if(opt){pickOption(Number(opt.dataset.option));return}const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(act==='close'){if(e.target===a||a.classList.contains('modal-x')){sourceOpen=false;render()}return}if(act==='home'){if(state.phase!=='home')state.previousPhase=state.phase;state.phase='home';save();render()}if(act==='language'){state.lang=state.lang==='en'?'zh':'en';save();render()}if(act==='start'||act==='restart')reset();if(act==='resume')next(state.food?(state.previousPhase||'trace'):'food');if(act==='finishTrace'&&state.clues.length>=2){state.taskStep=0;next('workshop')};if(act==='toCreator')next('arrival');if(act==='sources'){sourceOpen=true;render()}if(act==='export')exportLog();if(act==='copy')copySummary();if(act==='portrait')savePortrait();});
document.addEventListener('input',e=>{if(e.target.id==='mirrorAnswer'){state.mirrorText=e.target.value;save()}});
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportLog(){const content={version:'5.0',lang:state.lang,food:ff().id,foodName:T(ff().name),clues:state.clues,miniSelections:state.miniSelections,passportChoice:state.passportChoice,mirrorFocus:state.mirrorFocus,mirrorText:state.mirrorText,choices:state.choices,persona:outcome(),createdAt:state.createdAt,notice:'Fictional gameplay and portraits. Not a validated identity test; no data is sent to a server.'};download('Framing_Taiwan_play_route.json',new Blob([JSON.stringify(content,null,2)],{type:'application/json;charset=utf-8'}))}
function copySummary(){const p=personas[outcome()],str=`${T(p.name)}\n${T(p.subtitle)}\n${T(p.paragraph)}\n${T(p.question)}\n${G().yourway}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(str).then(()=>alert(G().copied)).catch(()=>fallbackCopy(str));else fallbackCopy(str)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert(G().copied)}
function wrap(ctx,text,maxWidth){const cps=[...text];let line='',lines=[];for(let c of cps){if(ctx.measureText(line+c).width>maxWidth&&line){lines.push(line);line=c}else line+=c}if(line)lines.push(line);return lines}
function savePortrait(){const p=personas[outcome()],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=900,h=1120;canvas.width=w;canvas.height=h;ctx.fillStyle='#142631';ctx.fillRect(0,0,w,h);const image=new Image();image.onload=()=>{ctx.drawImage(image,0,0,w,760);const gradient=ctx.createLinearGradient(0,470,0,900);gradient.addColorStop(0,'rgba(16,34,46,0)');gradient.addColorStop(.8,'rgba(16,34,46,.98)');gradient.addColorStop(1,'#10222e');ctx.fillStyle=gradient;ctx.fillRect(0,470,w,650);ctx.textAlign='left';ctx.fillStyle=p.color;ctx.font='bold 24px sans-serif';ctx.fillText('FRAMING TAIWAN · YOUR STORY',55,740);ctx.fillStyle='#fff6e8';ctx.font='bold 57px sans-serif';ctx.fillText(T(p.name),55,824);ctx.font='28px sans-serif';ctx.fillStyle='#e2e7e2';wrap(ctx,T(p.subtitle),770).slice(0,2).forEach((t,i)=>ctx.fillText(t,55,880+i*42));ctx.font='25px sans-serif';ctx.fillStyle='#b9d3d1';wrap(ctx,T(p.question),780).slice(0,3).forEach((t,i)=>ctx.fillText(t,55,985+i*36));canvas.toBlob(b=>{if(b){download('Framing_Taiwan_'+outcome()+'.png',b);alert(G().saved)}},'image/png')};image.src=PORTRAITS[p.portrait]}
render();
</script></body></html>
